<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estudar sem flashcards — Sinapse</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/sinapse/tokens.css">
<link rel="stylesheet" href="ds/sinapse/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Figtree:wght@400..800&amp;display=swap">
<style>
body{margin:0}
.lucide{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
a{color:var(--primary)}a:hover{color:var(--primary-hover)}

</style>
</helmet>
<div data-theme="{{tema}}" style="min-height: 900px; display: flex; flex-wrap: wrap; align-items: stretch; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 22px;">
  <div style="flex: 0 0 248px; background: var(--surface); border-right: 1px solid var(--line);">
    <dc-import name="Sidebar" ativo="estudar" tema="{{temaNome}}" on-tema="{{setTema}}" hint-size="248px,860px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 40px 40px 64px;">
    <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px;">
      <header style="display: flex; flex-direction: column; gap: 4px;">
        <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.01em;">Estudar</h1>
        <p style="margin: 0; color: var(--ink-muted);">Escolha o que revisar agora.</p>
      </header>
      <section style="display: grid; place-items: center; min-height: 560px; border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--surface);">
      <div class="sn-empty">
        <div class="sn-empty__art" aria-hidden="true">
          <span class="sn-empty__card"></span><span class="sn-empty__card"></span>
          <span class="sn-empty__card"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span>
        </div>
        <h2 class="sn-empty__title">Monte seu primeiro deck para começar a estudar</h2>
        <p class="sn-empty__body">Você ainda não tem flashcards salvos. Importe um PDF ou Word com suas perguntas, ou salve um deck pronto da Comunidade.</p>
        <div class="sn-empty__actions">
          <a class="sn-btn sn-btn--primary" href="Flashcards.dc.html" style="color: var(--on-primary);"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"></path><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"></path><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"></path></svg> Ir para Flashcards</a>
          <a class="sn-btn sn-btn--secondary" href="Comunidade.dc.html" style="color: var(--ink);"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> Explorar a Comunidade</a>
        </div>
      </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema": {"editor": "enum", "options": ["Claro", "Escuro"], "default": "Claro"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
renderVals() {
    const temaNome = (this.state && this.state.tema) || this.props.tema || 'Claro';
    return { tema: temaNome === 'Escuro' ? 'dark' : 'light', temaNome: temaNome, setTema: (nome) => this.setState({ tema: nome }), };
  }
}
</script>
</body>
</html>
