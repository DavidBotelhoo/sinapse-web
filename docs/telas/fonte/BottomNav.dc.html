<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Barra inferior — Sinapse</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/sinapse/tokens.css">
<link rel="stylesheet" href="ds/sinapse/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Figtree:wght@400..800&amp;display=swap">
<style>
body{margin:0}
.lucide{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div data-theme="{{temaAttr}}" style="width: 390px; box-sizing: border-box; padding-top: 34px; font-family: var(--font-sans);">
  <nav class="sn-bottomnav" aria-label="Navegação principal" style="padding-bottom: 12px;">
    <a class="sn-bottomnav__item" href="InicioCelular.dc.html" aria-current="{{atualInicio}}"><span class="sn-bottomnav__icon"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span>Início</a>
    <a class="sn-bottomnav__item" href="FlashcardsCelular.dc.html" aria-current="{{atualFlashcards}}"><span class="sn-bottomnav__icon"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"></path><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"></path><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"></path></svg></span>Flashcards</a>
    <a class="sn-bottomnav__item sn-bottomnav__item--play" href="EstudarCelular.dc.html" aria-current="{{atualEstudar}}"><span class="sn-bottomnav__play"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg></span>Estudar</a>
    <a class="sn-bottomnav__item" href="ComunidadeCelular.dc.html" aria-current="{{atualComunidade}}"><span class="sn-bottomnav__icon"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span>Comunidade</a>
    <a class="sn-bottomnav__item" href="PerfilCelular.dc.html" aria-current="{{atualPerfil}}"><span class="sn-bottomnav__icon"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ativo":{"editor":"enum","options":["inicio","flashcards","estudar","comunidade","perfil"],"default":"inicio"},"tema":{"editor":"enum","options":["Claro","Escuro"],"default":"Claro"},"$preview":{"width":390,"height":140}}'>
class Component extends DCLogic {
  renderVals() {
    const ativo = this.props.ativo ?? 'inicio';
    const atual = (id) => (ativo === id ? 'page' : undefined);
    return {
      temaAttr: (this.props.tema ?? 'Claro') === 'Escuro' ? 'dark' : 'light',
      atualInicio: atual('inicio'),
      atualFlashcards: atual('flashcards'),
      atualEstudar: atual('estudar'),
      atualComunidade: atual('comunidade'),
      atualPerfil: atual('perfil')
    };
  }
}
</script>
</body>
</html>
