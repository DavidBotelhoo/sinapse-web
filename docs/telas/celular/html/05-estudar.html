<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../design-system/fonts/fonts.css">
<link rel="stylesheet" href="../../../design-system/tokens.css">
<link rel="stylesheet" href="../../../design-system/components/bundle.css">
<style>html,body{margin:0}.sn-theme__thumb{z-index:0}</style>


<style>
body{margin:0}
.lucide{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
a{color:var(--primary)}a:hover{color:var(--primary-hover)}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.st-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:border-color var(--dur-fast) var(--ease-out),background-color var(--dur-fast) var(--ease-out)}
.st-tile:hover{border-color:var(--line-strong)}
.st-tile[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.st-tile .sn-check{position:absolute;top:16px;right:16px}
.st-tile[aria-pressed="true"] .sn-check,.st-row[aria-checked="true"] .sn-check{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.st-tile__name{padding-right:28px;font:600 16px/22px var(--font-sans)}
.st-tile__meta{font:500 13px/18px var(--font-sans);color:var(--ink-muted)}
.st-due{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--radius-full);font:600 12px/1 var(--font-sans);background:var(--surface-2);color:var(--ink-muted)}
.st-due--hoje{background:var(--primary-soft);color:var(--on-primary-soft)}
.st-tile[aria-pressed="true"] .st-due--hoje{background:var(--surface);color:var(--ink)}
.st-due--atraso{background:var(--accent-soft);color:var(--on-accent-soft)}
.st-list{margin:0;padding:0;list-style:none;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden}
.st-list li+li{border-top:1px solid var(--line)}
.st-row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.st-row:hover{background:var(--surface-2)}
.st-row__main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
.st-row__title{font:600 15px/20px var(--font-sans)}
.st-row__meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:500 13px/18px var(--font-sans);color:var(--ink-muted)}
.st-label{margin:0;font:600 13px/18px var(--font-sans);color:var(--ink-muted)}
.sn-tabs__tab[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.st-card{display:flex;flex-direction:column;gap:20px;padding:24px;border:1px solid var(--line);border-radius:var(--radius-xl);background:var(--surface);box-shadow:var(--shadow-sm)}
.st-h2{margin:0;font-family:var(--font-display);font-size:20px;line-height:26px;font-weight:600}
.st-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.st-facts>div{padding:10px 12px;border-radius:var(--radius-md);background:var(--surface-2)}
.st-facts dt{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}
.st-facts dd{margin:2px 0 0;font:700 17px/24px var(--font-sans);font-variant-numeric:tabular-nums}
.st-sel{display:flex;flex-wrap:wrap;gap:8px}
.st-hero{display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding:24px;border-radius:var(--radius-xl);background:var(--primary);color:var(--on-primary)}
.st-hero__icon{display:grid;place-items:center;width:52px;height:52px;flex:none;border-radius:var(--radius-full);background:color-mix(in srgb,var(--on-primary) 14%,transparent)}
.st-hero__icon .lucide{width:24px;height:24px}
.st-hero h2{margin:0;font-family:var(--font-display);font-size:22px;line-height:28px;font-weight:700}
.st-hero p{margin:2px 0 0;opacity:.85}
.st-disabled{opacity:.45;pointer-events:none}

.st-tile{padding:14px}.st-tile .sn-check{top:14px;right:14px}.st-tile__name{font-size:15px}
</style><style>
body{margin:0}
.lucide{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body><div id="root">

<div data-theme="light" style="width: 390px; min-height: 1420px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 22px;">
  <main style="flex: 1 1 auto; padding: 24px 16px 24px; display: flex; flex-direction: column; gap: 28px;">
      <header style="display: flex; flex-direction: column; gap: 4px;">
        <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.01em;">Estudar</h1>
        <p style="margin: 0; color: var(--ink-muted);">Escolha o que revisar agora.</p>
      </header>
    <section class="st-hero" aria-labelledby="hoje">
        <span class="st-hero__icon"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg></span>
        <div style="flex: 1 1 260px; min-width: 0;">
          <h2 id="hoje">Revisão de hoje</h2>
          <p>32 cards vencem hoje em 3 decks, cerca de 20 minutos. 5 estão atrasados.</p>
        </div>
        <a class="sn-btn sn-btn--secondary sn-btn--lg sn-btn--block" href="EstudarPerguntaCelular.dc.html" style="color: var(--ink);"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg> Revisar agora</a>
      </section>
    <section style="display: flex; flex-direction: column; gap: 16px;" aria-labelledby="montar-m">
      <h2 id="montar-m" class="st-h2">Monte sua sessão</h2>
      <div class="sn-tabs sn-tabs--block" role="tablist" aria-label="Estudar por">
              <button type="button" class="sn-tabs__tab" role="tab" aria-selected="true"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg> Por tema</button>
              <button type="button" class="sn-tabs__tab" role="tab" aria-selected="false"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"></path><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"></path><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"></path></svg> Por deck</button>
            </div>
      
        <div class="st-grid" style="grid-template-columns: repeat(2, minmax(0, 1fr));">
              
                <button type="button" class="st-tile" aria-pressed="true">
                  <span class="sn-check"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
                  <span class="st-tile__name">Farmacologia</span>
                  <span class="st-tile__meta">84 cards · 2º ano</span>
                  <span class="st-due st-due--hoje">15 para hoje</span>
                </button>
              
                <button type="button" class="st-tile" aria-pressed="true">
                  <span class="sn-check"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
                  <span class="st-tile__name">Fisiologia</span>
                  <span class="st-tile__meta">58 cards · 2º ano</span>
                  <span class="st-due st-due--hoje">12 para hoje</span>
                </button>
              
                <button type="button" class="st-tile" aria-pressed="false">
                  <span class="sn-check"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
                  <span class="st-tile__name">Patologia</span>
                  <span class="st-tile__meta">46 cards · 3º ano</span>
                  <span class="st-due st-due--atraso">5 atrasados</span>
                </button>
              
                <button type="button" class="st-tile" aria-pressed="false">
                  <span class="sn-check"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
                  <span class="st-tile__name">Anatomia</span>
                  <span class="st-tile__meta">120 cards · 1º ano</span>
                  <span class="st-due">Em dia</span>
                </button>
              
                <button type="button" class="st-tile" aria-pressed="false">
                  <span class="sn-check"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
                  <span class="st-tile__name">Bioquímica</span>
                  <span class="st-tile__meta">64 cards · 1º ano</span>
                  <span class="st-due">Em dia</span>
                </button>
              
                <button type="button" class="st-tile" aria-pressed="false">
                  <span class="sn-check"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
                  <span class="st-tile__name">Histologia</span>
                  <span class="st-tile__meta">38 cards · 1º ano</span>
                  <span class="st-due">Em dia</span>
                </button>
              
                <button type="button" class="st-tile" aria-pressed="false">
                  <span class="sn-check"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
                  <span class="st-tile__name">Microbiologia</span>
                  <span class="st-tile__meta">52 cards · 2º ano</span>
                  <span class="st-due">Em dia</span>
                </button>
              
                <button type="button" class="st-tile" aria-pressed="false">
                  <span class="sn-check"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
                  <span class="st-tile__name">Semiologia</span>
                  <span class="st-tile__meta">30 cards · 3º ano</span>
                  <span class="st-due">Em dia</span>
                </button>
              
            </div>
      
      
      <div style="display: flex; flex-wrap: wrap; gap: 16px;">
              <div style="display: flex; flex-direction: column; gap: 8px;">
                <p class="st-label" id="lbl-qtd">Quantos cards</p>
                <div class="sn-chips" role="radiogroup" aria-labelledby="lbl-qtd">
                  
                    <button type="button" class="sn-chip" role="radio" aria-checked="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>10</button>
                  
                    <button type="button" class="sn-chip" role="radio" aria-checked="true"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>20</button>
                  
                    <button type="button" class="sn-chip" role="radio" aria-checked="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>30</button>
                  
                    <button type="button" class="sn-chip" role="radio" aria-checked="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Todos</button>
                  
                </div>
              </div>
              <div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 8px;">
                <p class="st-label" id="lbl-ordem">Ordem</p>
                <div class="sn-tabs sn-tabs--block" role="radiogroup" aria-labelledby="lbl-ordem">
                  <button type="button" class="sn-tabs__tab" role="radio" aria-checked="true">Pendentes primeiro</button>
                  <button type="button" class="sn-tabs__tab" role="radio" aria-checked="false"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"></path><path d="m18 2 4 4-4 4"></path><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"></path><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"></path><path d="m18 14 4 4-4 4"></path></svg> Misturar</button>
                </div>
              </div>
            </div>
    </section>
  </main>
  <div class="st-card" style="position: sticky; bottom: 118px; z-index: 4; gap: 12px; margin: 0 8px 8px; padding: 16px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 600 14px/20px var(--font-sans);"><span>2 temas · 20 cards</span><span style="color: var(--ink-muted); font-weight: 500;">~13 min</span></div>
    <a class="sn-btn sn-btn--primary sn-btn--lg sn-btn--block" href="EstudarPerguntaCelular.dc.html" style="color: var(--on-primary);"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg> Começar sessão</a>
  </div>
  <div style="position: sticky; bottom: 0; z-index: 5;">
    

<div data-theme="light" style="width: 390px; box-sizing: border-box; padding-top: 34px; font-family: var(--font-sans);">
  <nav class="sn-bottomnav" aria-label="Navegação principal" style="padding-bottom: 12px;">
    <a class="sn-bottomnav__item" href="InicioCelular.dc.html"><span class="sn-bottomnav__icon"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span>Início</a>
    <a class="sn-bottomnav__item" href="FlashcardsCelular.dc.html"><span class="sn-bottomnav__icon"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"></path><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"></path><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"></path></svg></span>Flashcards</a>
    <a class="sn-bottomnav__item sn-bottomnav__item--play" href="EstudarCelular.dc.html" aria-current="page"><span class="sn-bottomnav__play"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg></span>Estudar</a>
    <a class="sn-bottomnav__item" href="ComunidadeCelular.dc.html"><span class="sn-bottomnav__icon"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span>Comunidade</a>
    <a class="sn-bottomnav__item" href="PerfilCelular.dc.html"><span class="sn-bottomnav__icon"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>Perfil</a>
  </nav>
</div>

</div>
