<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../design-system/fonts/fonts.css">
<link rel="stylesheet" href="../../../design-system/tokens.css">
<link rel="stylesheet" href="../../../design-system/components/bundle.css">
<style>html,body{margin:0}.sn-theme__thumb{z-index:0}</style>


<style>
body{margin:0}
.lucide{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
a{color:var(--primary)}a:hover{color:var(--primary-hover)}
.cd-card{display:flex;flex-direction:column;gap:20px;padding:24px;border:1px solid var(--line);border-radius:var(--radius-xl);background:var(--surface)}
.cd-step{display:flex;align-items:center;gap:10px}
.cd-step b{display:grid;place-items:center;width:26px;height:26px;border-radius:var(--radius-full);background:var(--primary-soft);color:var(--on-primary-soft);font:700 13px/1 var(--font-sans)}
.cd-step h2{margin:0;font-family:var(--font-display);font-size:20px;line-height:26px;font-weight:600}
.cd-label{margin:0;font:600 14px/20px var(--font-sans);color:var(--ink)}
.cd-help{margin:0;font:500 13px/18px var(--font-sans);color:var(--ink-muted)}
.cd-qa{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.cd-qa li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--bg)}
.cd-qa .n{grid-row:span 2;font:700 12px/20px var(--font-sans);color:var(--ink-faint);font-variant-numeric:tabular-nums}
.cd-qa .q{font:600 14px/20px var(--font-sans)}
.cd-qa .a{font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.cd-qa li[data-warn="true"]{border-color:var(--warning);background:var(--warning-soft)}
.cd-qa li[data-warn="true"] .a{color:var(--warning);font-weight:600;display:flex;align-items:center;gap:6px}
.cd-qa li[data-warn="true"] .a .lucide{width:16px;height:16px}
.sn-tabs__tab[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.cd-disabled{opacity:.45;pointer-events:none}

.cd-card{padding:20px;gap:16px}.cd-qa li:nth-child(n+4){display:none}
</style></head>
<body><div id="root">

<div data-theme="light" style="width: 390px; min-height: 1700px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 22px;">
  <header style="position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface);">
    <a class="sn-iconbtn" href="FlashcardsCelular.dc.html" aria-label="Voltar para Flashcards" style="color: var(--ink);"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
    <h1 style="margin: 0; font-family: var(--font-display); font-size: 20px; line-height: 26px; font-weight: 600;">Criar deck</h1>
  </header>
  <main style="flex: 1 1 auto; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 16px;">
    <section class="cd-card" aria-labelledby="passo1">
      <div class="cd-step"><b>1</b><h2 id="passo1">Arquivo</h2></div>
      
            <label class="sn-drop">
              <span class="sn-drop__icon"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 13v8"></path><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="m8 17 4-4 4 4"></path></svg></span>
              <p class="sn-drop__title">Arraste seu PDF ou Word aqui, ou <span class="sn-link">escolha um arquivo</span></p>
              <p class="sn-drop__hint">.pdf ou .docx · até 20 MB · uma pergunta e uma resposta por bloco</p>
            </label>
          
          
    </section>
    
    <section class="cd-card" aria-labelledby="passo2">
      <div class="cd-step"><b>2</b><h2 id="passo2">Detalhes</h2></div>
      <div class="sn-field">
              <label class="sn-field__label" for="nome-deck">Nome do deck</label>
              <div class="sn-field__control"><input id="nome-deck" type="text" value="" placeholder="Ex.: Farmacologia do SNA, P1" style=""></div>
              <p class="sn-field__hint">Aparece na sua lista e, se for público, na Comunidade.</p>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <p class="cd-label" id="lbl-ano">Ano do curso</p>
              <div class="sn-chips" role="radiogroup" aria-labelledby="lbl-ano">
                
                  <button type="button" class="sn-chip" role="radio" aria-checked="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>1º ano</button>
                
                  <button type="button" class="sn-chip" role="radio" aria-checked="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>2º ano</button>
                
                  <button type="button" class="sn-chip" role="radio" aria-checked="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>3º ano</button>
                
                  <button type="button" class="sn-chip" role="radio" aria-checked="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>4º ano</button>
                
                  <button type="button" class="sn-chip" role="radio" aria-checked="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>5º ano</button>
                
                  <button type="button" class="sn-chip" role="radio" aria-checked="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>6º ano</button>
                
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <p class="cd-label" id="lbl-mat">Matérias <span style="font-weight: 500; color: var(--ink-muted);">· escolha uma ou mais</span></p>
              <label class="sn-search"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input placeholder="Buscar outra matéria" aria-label="Buscar outra matéria" style=""></label>
              <div class="sn-chips" role="group" aria-labelledby="lbl-mat">
                
                  <button type="button" class="sn-chip" aria-pressed="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Farmacologia</button>
                
                  <button type="button" class="sn-chip" aria-pressed="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Fisiologia</button>
                
                  <button type="button" class="sn-chip" aria-pressed="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Anatomia</button>
                
                  <button type="button" class="sn-chip" aria-pressed="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Patologia</button>
                
                  <button type="button" class="sn-chip" aria-pressed="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Bioquímica</button>
                
                  <button type="button" class="sn-chip" aria-pressed="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Microbiologia</button>
                
                  <button type="button" class="sn-chip" aria-pressed="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Semiologia</button>
                
                  <button type="button" class="sn-chip" aria-pressed="false"><svg class="lucide sn-chip__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Histologia</button>
                
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <p class="cd-label" id="lbl-vis">Visibilidade</p>
              <div class="sn-tabs sn-tabs--block" role="radiogroup" aria-labelledby="lbl-vis">
                <button type="button" class="sn-tabs__tab" role="radio" aria-checked="true"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg> Privado</button>
                <button type="button" class="sn-tabs__tab" role="radio" aria-checked="false"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg> Público</button>
              </div>
              <p class="cd-help">Só você vê este deck. Dá para publicar depois.</p>
            </div>
    </section>
  </main>
  <div style="position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 28px; border-top: 1px solid var(--line); background: var(--bg);">
    <a class="sn-btn sn-btn--primary sn-btn--lg sn-btn--block cd-disabled" href="FlashcardsCelular.dc.html" style="color: var(--on-primary);"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg> Criar deck</a>
    <p class="cd-help" style="text-align: center;">Importe um arquivo para continuar.</p>
  </div>
</div>
</div>

</body></html>
