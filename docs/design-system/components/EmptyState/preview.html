<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EmptyState</title>
</head>
<body>
<div class="sn-empty">
  <div class="sn-empty__art" aria-hidden="true">
    <span class="sn-empty__card"></span>
    <span class="sn-empty__card"></span>
    <span class="sn-empty__card"><i data-lucide="plus"></i></span>
  </div>
  <h2 class="sn-empty__title">Monte seu primeiro deck para começar a estudar</h2>

    <a class="sn-btn sn-btn--primary" href="#"><i data-lucide="layers"></i> Ir para Flashcards</a>

<script>
  (function () {
    function icons() { if (window.lucide) window.lucide.createIcons(); }
    if (window.lucide) icons(); else { var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js'; s.onload = icons; document.head.appendChild(s); }
  })();
</script>
