<!-- @dsCard group="Estudo" height=560 subtitle="Estatísticas ao terminar a sessão" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SessionSummary</title>
<style>
  .demo { padding: 24px; }
</style>
</head>
<body>
<div class="demo">
  <section class="sn-summary" aria-labelledby="sum-title">
    <div class="sn-summary__hero">
      <div class="sn-ring" role="img" aria-label="78% de acerto">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="sn-ring__track" cx="60" cy="60" r="52"></circle>
          <circle class="sn-ring__value" cx="60" cy="60" r="52" stroke-dasharray="254.9 326.7"></circle>
        </svg>
        <div class="sn-ring__label" aria-hidden="true"><b>78%</b><span>de acerto</span></div>
      </div>
      <div>
        <h2 class="sn-summary__title" id="sum-title">Sessão concluída</h2>
        <p class="sn-summary__sub">20 cards de Farmacologia e Fisiologia em 14 minutos.</p>
      </div>
    </div>
    <div class="sn-breakdown">
      <div class="sn-breakdown__bar" aria-hidden="true">
        <span class="sn-mark--again" style="--n:3"></span><span class="sn-mark--hard" style="--n:5"></span><span class="sn-mark--easy" style="--n:12"></span>
      </div>
      <ul class="sn-breakdown__legend">
        <li><span class="sn-dot sn-mark--again"></span>Errei <b>3</b></li>
        <li><span class="sn-dot sn-mark--hard"></span>Difícil <b>5</b></li>
        <li><span class="sn-dot sn-mark--easy"></span>Fácil <b>12</b></li>
      </ul>
    </div>
    <dl class="sn-summary__facts">
      <div><dt>Tempo</dt><dd>14 min</dd></div>
      <div><dt>Por card</dt><dd>42 s</dd></div>
      <div><dt>Streak</dt><dd class="is-streak"><i data-lucide="flame"></i>13 dias</dd></div>
    </dl>
    <div class="sn-summary__actions">
      <button class="sn-btn sn-btn--primary"><i data-lucide="rotate-ccw"></i> Estudar novamente</button>
      <button class="sn-btn sn-btn--secondary">Escolher novos temas</button>
    </div>
  </section>
</div>
<script>
  (function () {
    function icons() { if (window.lucide) window.lucide.createIcons(); }
    if (window.lucide) icons(); else { var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js'; s.onload = icons; document.head.appendChild(s); }
  })();
</script>
</body>
</html>
