<!-- @dsCard group="Conta" height=800 width=1240 subtitle="Login e cadastro: painel deslizante no desktop, card que vira no celular" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AuthPanel</title>
<style>
  .demo { display: flex; align-items: flex-start; gap: 40px; padding: 24px; }
  .col { display: grid; gap: 10px; }
  .cap { margin: 0; font: 600 13px/18px var(--font-sans); color: var(--ink-muted); }
  .desk { width: 820px; }
  .phone { width: 360px; min-height: 700px; padding: 28px 16px; border: 1px solid var(--line); border-radius: 36px; background: var(--bg); }
</style>
</head>
<body>
<div class="demo">
  <div class="col">
    <p class="cap">Desktop: o painel colorido desliza e revela o outro formulário</p>
    <div class="desk" data-auth-demo></div>
  </div>
  <div class="col">
    <p class="cap">Celular: login e cadastro são as duas faces de um card</p>
    <div class="phone" data-auth-demo></div>
  </div>
</div>

<template id="auth-tpl">
  <div class="sn-auth" data-mode="login">
    <div class="sn-auth__brand-mobile"><span class="sn-wordmark">Sinapse</span></div>
    <div class="sn-auth__stage">
      <section class="sn-auth__panel sn-auth__panel--signup" aria-label="Criar conta">
        <div class="sn-auth__head">
          <h1 class="sn-auth__title">Criar conta</h1>
          <p class="sn-auth__sub">Leva menos de um minuto.</p>
        </div>
        <form class="sn-form" onsubmit="return false">
          <div class="sn-field-row">
            <div class="sn-field"><label class="sn-field__label">Nome</label><div class="sn-field__control"><input autocomplete="given-name" placeholder="Ana"></div></div>
            <div class="sn-field"><label class="sn-field__label">Sobrenome</label><div class="sn-field__control"><input autocomplete="family-name" placeholder="Souza"></div></div>
          </div>
          <div class="sn-field"><label class="sn-field__label">Email</label><div class="sn-field__control"><i data-lucide="mail"></i><input type="email" autocomplete="email" placeholder="voce@faculdade.edu.br"></div></div>
          <div class="sn-field"><label class="sn-field__label">Senha</label><div class="sn-field__control"><i data-lucide="lock"></i><input type="password" autocomplete="new-password" placeholder="Crie uma senha"></div><p class="sn-field__hint">Mínimo de 8 caracteres.</p></div>
          <button class="sn-btn sn-btn--primary sn-btn--block">Criar conta</button>
          <p class="sn-auth__legal">Ao criar a conta você aceita os <a class="sn-link" href="#">Termos</a> e a <a class="sn-link" href="#">Política de Privacidade</a>.</p>
        </form>
        <p class="sn-auth__switch">Já tem conta? <button class="sn-link" type="button" data-to="login">Entrar</button></p>
      </section>
      <section class="sn-auth__panel sn-auth__panel--login" aria-label="Entrar">
        <div class="sn-auth__head">
          <h1 class="sn-auth__title">Entrar</h1>
          <p class="sn-auth__sub">Que bom te ver de novo.</p>
        </div>
        <form class="sn-form" onsubmit="return false">
          <div class="sn-field"><label class="sn-field__label">Email</label><div class="sn-field__control"><i data-lucide="mail"></i><input type="email" autocomplete="email" placeholder="voce@faculdade.edu.br"></div></div>
          <div class="sn-field"><div class="sn-field__labelrow"><label class="sn-field__label">Senha</label><a class="sn-link" href="#">Esqueci minha senha</a></div><div class="sn-field__control"><i data-lucide="lock"></i><input type="password" autocomplete="current-password" placeholder="Sua senha"></div></div>
          <button class="sn-btn sn-btn--primary sn-btn--block">Entrar</button>
        </form>
        <p class="sn-auth__switch">Ainda não tem conta? <button class="sn-link" type="button" data-to="signup">Criar conta</button></p>
      </section>
      <div class="sn-auth__overlay">
        <div class="sn-auth__pattern" aria-hidden="true"></div>
        <span class="sn-auth__orb sn-auth__orb--a" aria-hidden="true"></span>
        <span class="sn-auth__orb sn-auth__orb--b" aria-hidden="true"></span>
        <span class="sn-auth__orb sn-auth__orb--c" aria-hidden="true"></span>
        <div class="sn-auth__pitch sn-auth__pitch--login">
          <span class="sn-wordmark">Sinapse</span>
          <div class="sn-auth__pitch-copy">
            <h2>Novo por aqui?</h2>
            <p>Crie sua conta e transforme seus resumos em flashcards em poucos minutos.</p>
            <button class="sn-btn sn-btn--on-primary" type="button" data-to="signup">Criar conta</button>
          </div>
        </div>
        <div class="sn-auth__pitch sn-auth__pitch--signup">
          <span class="sn-wordmark">Sinapse</span>
          <div class="sn-auth__pitch-copy">
            <h2>Já tem conta?</h2>
            <p>Entre e continue de onde parou. Sua sequência de estudos está te esperando.</p>
            <button class="sn-btn sn-btn--on-primary" type="button" data-to="login">Entrar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  (function () {
    var tpl = document.getElementById('auth-tpl');
    document.querySelectorAll('[data-auth-demo]').forEach(function (host, k) {
      host.appendChild(tpl.content.cloneNode(true));
      host.querySelectorAll('.sn-field').forEach(function (f, j) {
        var input = f.querySelector('input'), label = f.querySelector('label');
        var id = 'f' + k + '-' + j; input.id = id; label.setAttribute('for', id);
      });
    });
    function icons() { if (window.lucide) window.lucide.createIcons(); }
    if (window.lucide) icons(); else { var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js'; s.onload = icons; document.head.appendChild(s); }
    var DUR = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dur-auth')) || 680;
    document.querySelectorAll('.sn-auth').forEach(function (auth) {
      var login = auth.querySelector('.sn-auth__panel--login'), signup = auth.querySelector('.sn-auth__panel--signup');
      var pitchLogin = auth.querySelector('.sn-auth__pitch--login'), pitchSignup = auth.querySelector('.sn-auth__pitch--signup');
      function set(mode, focus) {
        auth.setAttribute('data-mode', mode);
        login.inert = mode !== 'login'; signup.inert = mode !== 'signup';
        pitchLogin.inert = mode !== 'login'; pitchSignup.inert = mode !== 'signup';
        if (focus) setTimeout(function () { var f = (mode === 'login' ? login : signup).querySelector('input'); if (f) f.focus({ preventScroll: true }); }, DUR);
      }
      auth.addEventListener('click', function (e) { var b = e.target.closest('[data-to]'); if (b) set(b.getAttribute('data-to'), true); });
      set('login', false);
    });
  })();
</script>
</body>
</html>
