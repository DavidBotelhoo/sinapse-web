<!-- @dsCard group="Painel" height=470 subtitle="Próximos 7 dias e decks que vencem no dia escolhido" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ReviewAgenda</title>
<style>
  .demo { padding: 24px; max-width: 520px; }
</style>
</head>
<body>
<div class="demo">
  <section class="sn-agenda" aria-labelledby="ag-title">
    <div class="sn-agenda__head">
      <h3 class="sn-agenda__title" id="ag-title">Agenda de revisão</h3>
      <span class="sn-tag sn-tag--brand">57 cards na semana</span>
    </div>
    <ol class="sn-agenda__days" id="days">
      <li><button class="sn-agenda__day" aria-pressed="true" aria-label="Hoje, domingo 15, 32 cards">Hoje<span class="sn-agenda__date">15</span><span class="sn-agenda__load">32</span></button></li>
      <li><button class="sn-agenda__day" aria-pressed="false" aria-label="Segunda 16, 8 cards">Seg<span class="sn-agenda__date">16</span><span class="sn-agenda__load">8</span></button></li>
      <li><button class="sn-agenda__day" aria-pressed="false" aria-label="Terça 17, 5 cards">Ter<span class="sn-agenda__date">17</span><span class="sn-agenda__load">5</span></button></li>
      <li><button class="sn-agenda__day" aria-pressed="false" aria-label="Quarta 18, nenhum card">Qua<span class="sn-agenda__date">18</span><span class="sn-agenda__load">–</span></button></li>
      <li><button class="sn-agenda__day" aria-pressed="false" aria-label="Quinta 19, 7 cards">Qui<span class="sn-agenda__date">19</span><span class="sn-agenda__load">7</span></button></li>
      <li><button class="sn-agenda__day" aria-pressed="false" aria-label="Sexta 20, 3 cards">Sex<span class="sn-agenda__date">20</span><span class="sn-agenda__load">3</span></button></li>
      <li><button class="sn-agenda__day" aria-pressed="false" aria-label="Sábado 21, 2 cards">Sáb<span class="sn-agenda__date">21</span><span class="sn-agenda__load">2</span></button></li>
    </ol>
    <ul class="sn-agenda__list">
      <li class="sn-agenda__item">
        <div class="sn-agenda__main"><span class="sn-agenda__name">Neoplasias: conceitos gerais</span><span class="sn-agenda__sub">Patologia · 3º ano · atrasado desde ontem</span></div>
        <span class="sn-count sn-count--accent">5</span>
      </li>
      <li class="sn-agenda__item">
        <div class="sn-agenda__main"><span class="sn-agenda__name">Farmacologia do sistema nervoso autônomo</span><span class="sn-agenda__sub">Farmacologia · 2º ano</span></div>
        <span class="sn-count">15</span>
      </li>
      <li class="sn-agenda__item">
        <div class="sn-agenda__main"><span class="sn-agenda__name">Fisiologia renal</span><span class="sn-agenda__sub">Fisiologia · 2º ano</span></div>
        <span class="sn-count">12</span>
      </li>
    </ul>
    <button class="sn-btn sn-btn--primary sn-btn--block"><i data-lucide="play"></i> Revisar os 32 de hoje</button>
  </section>
</div>
<script>
  (function () {
    function icons() { if (window.lucide) window.lucide.createIcons(); }
    if (window.lucide) icons(); else { var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js'; s.onload = icons; document.head.appendChild(s); }
    var days = document.getElementById('days');
    days.addEventListener('click', function (e) {
      var b = e.target.closest('.sn-agenda__day'); if (!b) return;
      days.querySelectorAll('.sn-agenda__day').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    });
  })();
</script>
</body>
</html>
