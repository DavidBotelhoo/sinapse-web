<!-- @dsCard group="Painel" height=250 subtitle="Streak, cards estudados, horas na semana, taxa de acerto" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>StatCard</title>
<style>
  .demo { padding: 24px; }
</style>
</head>
<body>
<div class="demo">
  <div class="sn-stats">
    <section class="sn-stat sn-stat--streak" aria-label="Streak">
      <div class="sn-stat__head"><span class="sn-stat__icon"><i data-lucide="flame"></i></span>Streak</div>
      <div class="sn-stat__value">12<span class="sn-stat__unit">dias</span></div>
      <div class="sn-week" aria-label="Dias estudados nesta semana: segunda a sábado">
        <span class="sn-week__day" data-done>S</span><span class="sn-week__day" data-done>T</span><span class="sn-week__day" data-done>Q</span><span class="sn-week__day" data-done>Q</span><span class="sn-week__day" data-done>S</span><span class="sn-week__day" data-done>S</span><span class="sn-week__day" data-today>D</span>
      </div>
    </section>
    <section class="sn-stat" aria-label="Cards estudados">
      <div class="sn-stat__head"><span class="sn-stat__icon"><i data-lucide="list-checks"></i></span>Cards estudados</div>
      <div class="sn-stat__value">342</div>
      <div class="sn-stat__meta sn-stat__meta--up"><i data-lucide="trending-up"></i> 18% a mais que na semana passada</div>
    </section>
    <section class="sn-stat" aria-label="Horas estudadas na semana">
      <div class="sn-stat__head"><span class="sn-stat__icon"><i data-lucide="clock"></i></span>Horas estudadas</div>
      <div class="sn-stat__value">6<span class="sn-stat__unit">h</span>40<span class="sn-stat__unit">min</span></div>
      <div class="sn-spark" aria-hidden="true"><span style="--h:40%"></span><span style="--h:75%"></span><span style="--h:55%"></span><span style="--h:100%"></span><span style="--h:30%"></span><span style="--h:65%"></span><span style="--h:20%" data-today></span></div>
      <div class="sn-stat__meta">Nesta semana</div>
    </section>
    <section class="sn-stat" aria-label="Taxa de acerto">
      <div class="sn-stat__head"><span class="sn-stat__icon"><i data-lucide="target"></i></span>Taxa de acerto</div>
      <div class="sn-stat__value">78<span class="sn-stat__unit">%</span></div>
      <div class="sn-progress" role="progressbar" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100" aria-label="Taxa de acerto"><span style="--value:78%"></span></div>
      <div class="sn-stat__meta">Fácil + Difícil, últimos 7 dias</div>
    </section>
  </div>
</div>
<script>
  (function () {
    function icons() { if (window.lucide) window.lucide.createIcons(); }
    if (window.lucide) icons(); else { var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js'; s.onload = icons; document.head.appendChild(s); }
  })();
</script>
</body>
</html>
