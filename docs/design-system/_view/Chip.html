<!doctype html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="../components/lib/lucide.min.js"></script><script>document.documentElement.setAttribute("data-theme", new URLSearchParams(location.search).get("theme") || "light")</script>
<meta charset="utf-8">
<title>Chip</title>
<style>
  .demo { display: grid; gap: 18px; padding: 24px; }
  .label { margin: 0 0 8px; font: 600 13px/18px var(--font-sans); color: var(--ink); }
</style>
</head>
<body>
<div class="demo">
  <div>
    <p class="label" id="l-ano">Ano do curso</p>
    <div class="sn-chips" role="radiogroup" aria-labelledby="l-ano" data-single>
      <button class="sn-chip" role="radio" aria-checked="false">1º ano</button>
      <button class="sn-chip" role="radio" aria-checked="true"><i data-lucide="check" class="sn-chip__check"></i>2º ano</button>
      <button class="sn-chip" role="radio" aria-checked="false">3º ano</button>
      <button class="sn-chip" role="radio" aria-checked="false">4º ano</button>
      <button class="sn-chip" role="radio" aria-checked="false">5º ano</button>
      <button class="sn-chip" role="radio" aria-checked="false">6º ano</button>
    </div>
  </div>
  <div>
    <p class="label" id="l-mat">Matérias</p>
    <div class="sn-chips" aria-labelledby="l-mat">
      <button class="sn-chip" aria-pressed="true"><i data-lucide="check" class="sn-chip__check"></i>Farmacologia</button>
      <button class="sn-chip" aria-pressed="true"><i data-lucide="check" class="sn-chip__check"></i>Fisiologia</button>
      <button class="sn-chip" aria-pressed="false"><i data-lucide="check" class="sn-chip__check"></i>Anatomia</button>
      <button class="sn-chip" aria-pressed="false"><i data-lucide="check" class="sn-chip__check"></i>Bioquímica</button>
      <button class="sn-chip" aria-pressed="false"><i data-lucide="check" class="sn-chip__check"></i>Patologia</button>
    </div>
  </div>
  <div class="sn-chips">
    <span class="sn-chip sn-chip--removable">2º ano <button class="sn-chip__remove" aria-label="Remover filtro 2º ano"><i data-lucide="x"></i></button></span>
    <span class="sn-chip sn-chip--removable">Farmacologia <button class="sn-chip__remove" aria-label="Remover filtro Farmacologia"><i data-lucide="x"></i></button></span>
  </div>
</div>
<script>
  (function () {
    function icons() { if (window.lucide) window.lucide.createIcons(); }
    if (window.lucide) icons(); else { var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js'; s.onload = icons; document.head.appendChild(s); }
    document.querySelectorAll('[data-single]').forEach(function (g) {
      g.addEventListener('click', function (e) {
        var b = e.target.closest('.sn-chip'); if (!b) return;
        g.querySelectorAll('.sn-chip').forEach(function (c) {
          var on = c === b; c.setAttribute('aria-checked', String(on));
          if (on && !c.querySelector('.sn-chip__check')) { c.insertAdjacentHTML('afterbegin', '<i data-lucide="check" class="sn-chip__check"></i>'); icons(); }
        });
      });
    });
    document.querySelectorAll('.sn-chip[aria-pressed]').forEach(function (c) {
      c.addEventListener('click', function () { c.setAttribute('aria-pressed', String(c.getAttribute('aria-pressed') !== 'true')); });
    });
    document.querySelectorAll('.sn-chip__remove').forEach(function (b) {
      b.addEventListener('click', function () { b.closest('.sn-chip').remove(); });
    });
  })();
</script>
</body>
</html>
